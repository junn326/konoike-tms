<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ค่าเที่ยว TR">
  <meta name="theme-color" content="#1a73e8">
  <title>ค่าเที่ยว TR</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="icon" href="icon-192.png">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; min-height: 100%; background: linear-gradient(135deg, #1a73e8, #0d47a1); font-family: Arial, 'Segoe UI', sans-serif; }
    .wrap {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center; flex-direction: column;
      color: #fff; text-align: center; padding: 24px;
    }
    .logo { width: 92px; height: 92px; border-radius: 24px; background: rgba(255,255,255,0.15); display: flex; align-items: center; justify-content: center; font-size: 42px; margin-bottom: 18px; }
    .title { font-size: 26px; font-weight: 700; margin-bottom: 8px; }
    .subtitle { font-size: 15px; opacity: 0.9; margin-bottom: 22px; }
    .loader { width: 44px; height: 44px; border: 4px solid rgba(255,255,255,0.25); border-top-color: #fff; border-radius: 50%; animation: spin 0.9s linear infinite; margin-bottom: 26px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .open-btn {
      display: inline-block; background: #fff; color: #0d47a1;
      border: none; border-radius: 14px; padding: 15px 40px;
      font-size: 17px; font-weight: 700; cursor: pointer; text-decoration: none;
      box-shadow: 0 8px 24px rgba(0,0,0,0.25); transition: transform 0.15s;
    }
    .open-btn:active { transform: scale(0.97); }
    .hint { font-size: 13px; opacity: 0.8; margin-top: 16px; max-width: 300px; line-height: 1.5; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="logo">🚛</div>
    <div class="title">ค่าเที่ยว TR</div>
    <div class="subtitle">ระบบบันทึกงานขนส่ง</div>
    <div class="loader" id="loader"></div>
    <a class="open-btn" id="openBtn" href="#" style="display:none;">เปิดระบบ ▶</a>
    <div class="hint" id="hint" style="display:none;">หากไม่เปิดอัตโนมัติ กดปุ่ม "เปิดระบบ"</div>
  </div>

  <script>
    const GAS_BASE = 'https://script.google.com/macros/s/AKfycbyB6oZsTVsy0tjWpBt6u4UYlEd5i_l4Q6Vr2CW1wKLXmf4Qq7FE4w8xToOhhham3Lpk/exec';

    // ตั้ง href ปุ่มสำรอง
    document.getElementById('openBtn').href = GAS_BASE;

    // Service Worker (ให้ติดตั้งเป็น PWA + มี icon บนจอ)
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(function(e){ console.warn('SW:', e); });
    }

    // เด้งเข้าระบบ GAS ตรงๆ (top-level ไม่ใช่ iframe → ไม่ติด X-Frame-Options)
    setTimeout(function() {
      window.location.replace(GAS_BASE);
    }, 700);

    // เผื่อ redirect ถูกบล็อก → โชว์ปุ่มสำรองหลัง 2.5 วินาที
    setTimeout(function() {
      document.getElementById('loader').style.display = 'none';
      document.getElementById('openBtn').style.display = 'inline-block';
      document.getElementById('hint').style.display = 'block';
    }, 2500);
  </script>
</body>
</html>
